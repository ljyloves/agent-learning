services:
  postgres:
    image: postgres:16-alpine
    container_name: flowgate-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowgate}
      POSTGRES_USER: ${POSTGRES_USER:-flowgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowgate_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ./docker/postgres/init.sql
        target: /docker-entrypoint-initdb.d/10-init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - flowgate-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flowgate-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-flowgate_redis_dev}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q '^PONG$'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - flowgate-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: flowgate-qdrant
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-flowgate_qdrant_dev}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - flowgate-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: flowgate-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_REST_PORT: 6333
      QDRANT_GRPC_PORT: 6334
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - type: bind
        source: ./storage
        target: /app/storage
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)); assert data['status'] == 'healthy'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - flowgate-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: flowgate-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - flowgate-net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  qdrantdata:

networks:
  flowgate-net:
    driver: bridge
